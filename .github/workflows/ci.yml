name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting on changed Go files
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            files=$(git diff --name-only --diff-filter=ACM "origin/$GITHUB_BASE_REF"...HEAD -- '*.go')
          else
            files=$(git diff --name-only --diff-filter=ACM HEAD^ HEAD -- '*.go')
          fi

          if [[ -z "$files" ]]; then
            exit 0
          fi

          unformatted=$(gofmt -l $files)
          if [[ -n "$unformatted" ]]; then
            echo "The following changed Go files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Normalize module metadata
        run: go mod tidy
      - name: Commit normalized module metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore(deps): tidy GOBL module graph"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Verify module metadata
        shell: bash
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
