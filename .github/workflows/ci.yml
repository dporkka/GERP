name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting on changed Go files
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            files=$(git diff --name-only --diff-filter=ACM "origin/$GITHUB_BASE_REF"...HEAD -- '*.go')
          else
            files=$(git diff --name-only --diff-filter=ACM HEAD^ HEAD -- '*.go')
          fi

          if [[ -z "$files" ]]; then
            exit 0
          fi

          unformatted=$(gofmt -l $files)
          if [[ -n "$unformatted" ]]; then
            echo "The following changed Go files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Normalize module metadata
        run: go mod tidy
      - name: Capture normalized module metadata
        uses: actions/upload-artifact@v4
        with:
          name: tidy-module-files
          path: |
            go.mod
            go.sum
          retention-days: 1
      - name: Verify module metadata
        shell: bash
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
