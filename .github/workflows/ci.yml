name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gerp
          POSTGRES_PASSWORD: gerp
          POSTGRES_DB: gerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerp -d gerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting on changed Go files
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            files=$(git diff --name-only --diff-filter=ACM "origin/$GITHUB_BASE_REF"...HEAD -- '*.go')
          else
            files=$(git diff --name-only --diff-filter=ACM HEAD^ HEAD -- '*.go')
          fi

          if [[ -z "$files" ]]; then
            exit 0
          fi

          unformatted=$(gofmt -l $files)
          if [[ -n "$unformatted" ]]; then
            echo "The following changed Go files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result."
            exit 1
          fi
      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: gerp
        shell: bash
        run: |
          for migration in migrations/postgres/*.sql; do
            echo "Applying $migration"
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=gerp \
              --dbname=gerp_test \
              --set=ON_ERROR_STOP=1 \
              --file="$migration"
          done
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
